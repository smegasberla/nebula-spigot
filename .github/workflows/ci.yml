name: Nebula CI

on:
  push:
    branches: [ "ver/1.21.11" ]
  pull_request:
    branches: [ "ver/1.21.11" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: gradle

      - name: Configure Git
        run: |
          git config --global user.email "ci@nebula.spyral"
          git config --global user.name "Nebula CI"

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace --no-daemon

      - name: Build bundler jar
        run: ./gradlew leaf-server:createBundlerJar --stacktrace --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebula-bundler
          path: leaf-server/build/libs/*.jar

  smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: nebula-bundler

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Run smoke test
        run: |
          JAR=$(ls *.jar | head -1)
          chmod +x scripts/ci-smoke.sh
          scripts/ci-smoke.sh "$JAR" ""

  plugin-compat:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: nebula-bundler

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Run plugin compatibility test
        run: |
          JAR=$(ls *.jar | head -1)
          chmod +x scripts/ci-smoke.sh
          # Download Spark plugin for compatibility check
          scripts/ci-smoke.sh "$JAR" "https://ci.lucko.me/job/spark/lastSuccessfulBuild/artifact/spark-bukkit/build/libs/spark-*-bukkit.jar"
